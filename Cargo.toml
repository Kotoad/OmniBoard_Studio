[package]
name = "Omniboard_Studio"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "LICENCE.txt"

[dev-dependencies]
proptest = "1"

[dependencies]
eframe = {version = "0.36.1", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"]}
egui = { version = "0.36.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4", features = ["serde"] }
toml = "1.1.4"
directories  = "6.0.0"
notify = "8.2"
egui_extras = { version = "0.36.1", features = ["image"] }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"   
rust-embed = "8.12"       
unic-langid = "0.9"     
fluent = "0.17"        
once_cell = "1.21.4"
log = "0.4.34"
env_logger = "0.11.11"
rfd = "0.17.2"
bincode = { version = "2", features = ["serde"] }