[package]
name = "Omniboard_Studio"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "LICENCE.txt"

[dependencies]
eframe = {version = "0.27", default-features = false, features = ["glow", "default_fonts"]}
egui = "0.27"
serde_json = "1"
chrono = "0.4"
notify = "6"
egui_extras = { version = "0.27", features = ["image"] }
image = { version = "0.24", default-features = false, features = ["png"] }
