[package]
name = "Omniboard_Studio"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "LICENCE.txt"

[dependencies]
eframe = {version = "0.30", default-features = false, features = ["glow", "default_fonts"]}
egui = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
toml = "0.8"
directories  = "1"
notify = "6"
egui_extras = { version = "0.30", features = ["image"] }
image = { version = "0.24", default-features = false, features = ["png"] }
i18n-embed = { version = "0.15", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.9"   
rust-embed = "8"       
unic-langid = "0.9"     
fluent = "0.16"        
once_cell = "1.21.4"
log = "0.4.33"
env_logger = "0.11.11"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }