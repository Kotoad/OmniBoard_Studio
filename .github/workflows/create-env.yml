name: Create Web .env

# Generates Web_page/Admin/.env from GitHub repository secrets.
#
# config.php reads this file at runtime, so every secret listed below maps to a
# variable name it expects (note the GitHub OAuth keys are named *_GITHUB on
# purpose — see Admin/config.php).
#
# This workflow is meant to run as the first step of a deploy: it writes the
# .env into the checked-out tree so a following job (FTP/SFTP/rsync upload) can
# ship it. It deliberately never prints secret values or uploads the .env as an
# artifact, since artifacts are downloadable.

on:
  workflow_dispatch:   # run manually from the Actions tab

jobs:
  create-env:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          ref: main  # adjust if your default branch is not 'main'

      - name: Create .env file
        run: |
          echo "POSTHOG_PERSONAL_API_KEY=${{ secrets.POSTHOG_PERSONAL_API_KEY }}" >> .env
          echo "POSTHOG_PROJECT_ID=${{ secrets.POSTHOG_PROJECT_ID }}" >> .env
          echo "POSTHOG_PROJECT_KEY=${{ secrets.POSTHOG_PROJECT_KEY }}" >> .env
          echo "TOKEN_GITHUB=${{ secrets.TOKEN_GITHUB }}" >> .env
          echo "CLIENT_ID_GITHUB=${{ secrets.CLIENT_ID_GITHUB }}" >> .env
          echo "CLIENT_SECRET_GITHUB=${{ secrets.CLIENT_SECRET_GITHUB }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}" >> .env
          echo 'ADMIN_PASSWORD_HASH=${{ secrets.ADMIN_PASSWORD_HASH }}' >> .env
          echo 'IP_HASH_SALT=${{ secrets.IP_HASH_SALT }}' >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env
          echo "ACTION_API_TOKEN=${{ secrets.ACTION_API_TOKEN }}" >> .env

      - name: install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Move .env to Web_page/Admin
        run: |
          lftp -c "
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
          put .env -o /Admin/.env;
          "