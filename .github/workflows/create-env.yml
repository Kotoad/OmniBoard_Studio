name: Create Web .env

# Generates Web_page/Admin/.env from GitHub repository secrets.
#
# config.php reads this file at runtime, so every secret listed below maps to a
# variable name it expects (note the GitHub OAuth keys are named *_GITHUB on
# purpose — see Admin/config.php).
#
# This workflow is meant to run as the first step of a deploy: it writes the
# .env into the checked-out tree so a following job (FTP/SFTP/rsync upload) can
# ship it. It deliberately never prints secret values or uploads the .env as an
# artifact, since artifacts are downloadable.

on:
  workflow_dispatch:   # run manually from the Actions tab
  workflow_call:       # or call from a deploy workflow:  uses: ./.github/workflows/create-env.yml

permissions:
  contents: read

jobs:
  create-env:
    runs-on: ubuntu-latest
    env:
      ENV_PATH: Web_page/Admin/.env
      # ── Map secrets -> the names config.php / add_release.php read ──
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
      POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      CLIENT_ID_GITHUB: ${{ secrets.CLIENT_ID_GITHUB }}
      CLIENT_SECRET_GITHUB: ${{ secrets.CLIENT_SECRET_GITHUB }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
      IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
      ACTION_API_TOKEN: ${{ secrets.ACTION_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ENV_PATH")"

          # Heredoc keeps values out of the build log (no echo / set -x).
          # 'EOF' is unquoted so the env vars above are expanded.
          cat > "$ENV_PATH" <<EOF
          # Generated by .github/workflows/create-env.yml — do not commit.
          DB_HOST=${DB_HOST}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASS=${DB_PASS}

          POSTHOG_PERSONAL_API_KEY=${POSTHOG_PERSONAL_API_KEY}
          POSTHOG_PROJECT_ID=${POSTHOG_PROJECT_ID}
          POSTHOG_PROJECT_KEY=${POSTHOG_PROJECT_KEY}

          TOKEN_GITHUB=${TOKEN_GITHUB}
          CLIENT_ID_GITHUB=${CLIENT_ID_GITHUB}
          CLIENT_SECRET_GITHUB=${CLIENT_SECRET_GITHUB}

          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

          ADMIN_USERNAME=${ADMIN_USERNAME}
          ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}

          IP_HASH_SALT=${IP_HASH_SALT}
          ACTION_API_TOKEN=${ACTION_API_TOKEN}
          EOF

          chmod 600 "$ENV_PATH"

      - name: Verify (names only, never values)
        shell: bash
        run: |
          set -euo pipefail
          echo "Wrote $ENV_PATH with $(grep -c '=' "$ENV_PATH") variables:"
          # Print only the keys (left of '='), skipping comments/blanks.
          grep -v '^[[:space:]]*#' "$ENV_PATH" | grep '=' | cut -d= -f1 | sed 's/^/  - /'

          # Fail early if the critical DB secrets are missing.
          missing=0
          for key in DB_HOST DB_NAME DB_USER DB_PASS; do
            if ! grep -q "^${key}=.\+" "$ENV_PATH"; then
              echo "::error::Secret '${key}' is empty or unset"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
