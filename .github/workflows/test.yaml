name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libdbus-1-dev libxkbcommon-dev libgl1-mesa-dev
      - name: Build project
        run: cargo build --locked 
      - name: Run clippy
        if: runner.os == 'Linux'
        run: cargo clippy -- -D warnings
      - name: Run fmt check
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Run tests
        run: cargo test