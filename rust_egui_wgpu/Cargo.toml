[package]
name = "omniboard_egui_wgpu_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
# eframe is egui's application framework. We use the `glow` (OpenGL) backend:
# this machine's Intel HD 4000 is DX11-only with no Vulkan, so the wgpu backend
# either falls back to the WARP software renderer (very slow) or, on its GL
# backend, fails to render text on the old Intel driver. glow runs natively on
# this GPU and renders correctly.
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts"] }
egui   = "0.27"
